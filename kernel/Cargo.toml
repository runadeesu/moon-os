[package]
name = "moon_kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "moon_kernel"
path = "src/main.rs"

[dependencies]
# spin::Mutex is the only external dependency: a tiny no_std spinlock.
# Everything else -- Limine boot-protocol bindings, GDT/IDT, drivers,
# the framebuffer console, memory management -- is our own code.
spin = { version = "0.9", default-features = false, features = ["spin_mutex"] }
