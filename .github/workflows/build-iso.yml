name: Build ISO

# Builds moon-os.iso the same way tools/build.sh does locally, so nobody
# needs to run that script on their own machine just to get a fresh ISO --
# every push/PR produces one automatically as a downloadable artifact.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm xorriso mtools git

      - name: Install Rust (stable) with the bare-metal target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none

      - name: Cache cargo registry/build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            userland/init/target
            userland/counter/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Limine bootloader checkout
        uses: actions/cache@v4
        with:
          path: third_party/limine
          key: limine-v9.x-binary

      - name: Build ISO
        run: ./tools/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: moon-os-iso
          path: build/moon-os.iso
          if-no-files-found: error
